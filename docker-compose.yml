
services:

  backend:
    build: ./tiktokbackend
    container_name: tiktok-backend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8002:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - tiktok_network

  mysql:
    image: mysql:8.0
    container_name: tiktok-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - tiktok_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - tiktok_network

volumes:
  tiktok_mysql_data:

networks:
  tiktok_network:
    driver: bridge
